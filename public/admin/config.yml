# Gelian CMS configuration (Sveltia CMS)
#
# Every field below maps to a value in src/content/data/*.json. Saving in the
# CMS commits straight to the main branch on GitHub, which triggers a Netlify
# rebuild — so a change is live a minute or two after you press Publish.
#
# Adding a field here does not add it to the website; the site code has to know
# about it too. Editing labels and help text is always safe.

backend:
  name: github
  repo: gellerbatra-max/gallion
  branch: main

media_folder: public/media
public_folder: /media

collections:
  # ------------------------------------------------------------------ #
  - name: content
    label: Website content
    files:
      # ---------------------------------------------------------------- #
      - name: site
        label: Business details
        file: src/content/data/site.json
        description: >-
          Your name, tagline, contact details, offices and social links —
          used in the header, footer, contact page and search-engine data.
        fields:
          - label: Business
            name: site
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Legal name, name: legalName, widget: string }
              - {
                  label: Website address,
                  name: url,
                  widget: string,
                  hint: "Used for search engines and link previews. Include https://",
                }
              - {
                  label: Tagline,
                  name: tagline,
                  widget: string,
                  hint: "Shown in the browser tab and search results.",
                }
              - { label: Description, name: description, widget: text }
              - { label: Year founded, name: founded, widget: number, value_type: int }
              - {
                  label: Mission line,
                  name: mission,
                  widget: text,
                  hint: "Shown in the footer.",
                }
              - {
                  label: Legal positioning note,
                  name: legalNote,
                  widget: text,
                  hint: "The precise statement of what kind of investment vehicle this is, shown at the very bottom of every page. Keep this accurate — it is the line that keeps 'investment vehicle' from reading as a regulated-fund claim.",
                }

          - label: Main menu
            name: nav
            widget: list
            label_singular: menu item
            summary: "{{fields.label}}"
            hint: "The four links across the top of every page: Home, About, Philosophy, Contact."
            fields:
              - { label: Label, name: label, widget: string }
              - {
                  label: Link,
                  name: href,
                  widget: string,
                  hint: "A page on this site, e.g. /about",
                }

          - label: Footer menu
            name: footerNav
            widget: list
            label_singular: footer column
            summary: "{{fields.title}}"
            fields:
              - { label: Column heading, name: title, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

          - label: Contact details
            name: contact
            widget: object
            fields:
              - { label: General email, name: general, widget: string }
              - { label: Partnerships email, name: partnerships, widget: string }
              - { label: Press email, name: press, widget: string }
              - { label: Phone (displayed), name: phone, widget: string }
              - {
                  label: Phone (link),
                  name: phoneHref,
                  widget: string,
                  pattern: ['^tel:\+?[0-9]+$', "Must look like tel:+94771234567"],
                  hint: "The tappable version. Digits only, no spaces.",
                }
              - {
                  label: WhatsApp link,
                  name: whatsapp,
                  widget: string,
                  hint: "e.g. https://wa.me/94771234567",
                }
              - label: Offices
                name: offices
                widget: list
                label_singular: office
                summary: "{{fields.city}}"
                fields:
                  - { label: City, name: city, widget: string }
                  - { label: Country, name: country, widget: string }
                  - {
                      label: Role,
                      name: role,
                      widget: string,
                      hint: "e.g. Registered office",
                    }
                  - { label: Note, name: note, widget: string }
                  - {
                      label: Coordinates,
                      name: coords,
                      widget: string,
                      hint: "Decorative text only, e.g. 6.9271° N, 79.8612° E",
                    }
              - { label: Response time line, name: responseTime, widget: text }

          - label: Social links
            name: social
            widget: list
            label_singular: social link
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

          - label: Ports
            name: ports
            widget: list
            label_singular: port
            summary: "{{fields.code}} — {{fields.name}}"
            hint: Shown on the route diagram on the home page.
            fields:
              - {
                  label: Code,
                  name: code,
                  widget: string,
                  hint: "Three letters, e.g. CMB",
                }
              - { label: Name, name: name, widget: string }
              - { label: Region, name: region, widget: string }

      # ---------------------------------------------------------------- #
      - name: home
        label: Home page
        file: src/content/data/home.json
        description: Every section of the home page, top to bottom.
        fields:
          - label: Search-engine title & description
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Hero
            name: hero
            widget: object
            hint: The full-height opening section.
            fields:
              - {
                  label: Kicker,
                  name: kicker,
                  widget: string,
                  hint: "Small line above the headline, e.g. Colombo · Private investment vehicle",
                }
              - { label: Headline, name: headline, widget: text }
              - {
                  label: Headline — gold phrase,
                  name: headlineAccent,
                  widget: string,
                  hint: "Must be an exact substring of the headline above — that phrase is rendered in gold. If it doesn't match, the whole headline just renders in plain text.",
                }
              - { label: Subheadline, name: subheadline, widget: text }
              - label: Primary button
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Secondary button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Stat strip
                name: stats
                widget: list
                label_singular: stat
                summary: "{{fields.value}} — {{fields.label}}"
                hint: "Four short facts under the buttons. Keep these factual — no invented performance numbers."
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }

          - label: "What Gelian is"
            name: whatWeAre
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Primary button
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Secondary button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

          - label: "The vessel"
            name: vessel
            widget: object
            hint: The three-card section explaining Gelian as a trade vessel.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Cards
                name: cards
                widget: list
                label_singular: card
                summary: "{{fields.tier}} — {{fields.name}}"
                fields:
                  - { label: "Small label (top)", name: tier, widget: string }
                  - { label: "Card title", name: name, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: "The exchange (both directions)"
            name: exchange
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading — line one, name: title, widget: string }
              - { label: Heading — gold line two, name: titleAccent, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }
              - { label: "Corridors box label", name: corridorsLabel, widget: string }
              - { label: "Corridors disclaimer", name: corridorsNote, widget: text }

          - label: "How value is identified"
            name: process
            widget: object
            hint: The four-step Discover / Curate / Refine / Carry section.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Steps
                name: steps
                widget: list
                label_singular: step
                summary: "{{fields.label}} — {{fields.title}}"
                fields:
                  - { label: "Number (e.g. 01)", name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: "Future directions — intro"
            name: directionsPreview
            widget: object
            hint: "The heading above the direction cards. The cards themselves are edited under 'Future directions' below, shared with the About page."
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Button
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

          - label: "Vision statement"
            name: vision
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Pull quote, name: quote, widget: text }
              - { label: Body text, name: body, widget: text }
              - { label: Attribution name, name: attributionName, widget: string }
              - { label: Attribution role, name: attributionRole, widget: string }

          - label: "Closing call to action"
            name: closingCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - label: Primary button
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Secondary button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

      # ---------------------------------------------------------------- #
      - name: about
        label: About page
        file: src/content/data/about.json
        description: Every section of the About page, top to bottom.
        fields:
          - label: Search-engine title & description
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Page header
            name: header
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: "Fact strip (4 items)"
                name: meta
                widget: list
                label_singular: fact
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }

          - label: "The name"
            name: identity
            widget: object
            hint: Explains the vessel/galleon metaphor behind the name.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }

          - label: "What Gelian is not"
            name: distinction
            widget: object
            hint: The section distinguishing an investment vehicle from a venture firm.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Cards
                name: cards
                widget: list
                label_singular: card
                summary: "{{fields.tier}} — {{fields.name}}"
                fields:
                  - { label: "Small label (top)", name: tier, widget: string }
                  - { label: "Card title", name: name, widget: string }
                  - { label: Body, name: body, widget: text }
              - { label: Closing note, name: closingNote, widget: text }

          - label: "The founding idea"
            name: originStory
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }

          - label: "The long view"
            name: longView
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }

          - label: Milestones
            name: milestones
            widget: list
            label_singular: milestone
            summary: "{{fields.year}} — {{fields.title}}"
            hint: The timeline on the About page.
            fields:
              - { label: Year, name: year, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: body, widget: text }
              - {
                  label: Still planned,
                  name: planned,
                  widget: boolean,
                  required: false,
                  default: false,
                  hint: "Tick for things that have not happened yet — they render muted so nothing reads as already achieved.",
                }

          - label: "Journey section — heading"
            name: journey
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }

          - label: "Future directions — intro"
            name: directionsPreview
            widget: object
            hint: "The heading above the direction cards on this page. The cards themselves are edited under 'Future directions', shared with the home page."
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }

          - label: "Closing call to action"
            name: closingCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - label: Primary button
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Secondary button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

      # ---------------------------------------------------------------- #
      - name: philosophy
        label: Philosophy page
        file: src/content/data/philosophy.json
        description: Every section of the Philosophy page, top to bottom.
        fields:
          - label: Search-engine title & description
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Page header
            name: header
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: "Fact strip (4 items)"
                name: meta
                widget: list
                label_singular: fact
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }

          - label: Opening essay
            name: opening
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                label_singular: paragraph
                field: { label: Paragraph, name: paragraph, widget: text }
              - { label: Pull quote, name: pullQuote, widget: text }

          - label: Manifesto
            name: manifesto
            widget: object
            hint: The eight numbered principles.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Principles
                name: principles
                widget: list
                label_singular: principle
                summary: "{{fields.number}}. {{fields.title}}"
                fields:
                  - { label: "Numeral (e.g. IV)", name: number, widget: string }
                  - { label: "Short name", name: title, widget: string }
                  - { label: Claim, name: claim, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: "What this rules out"
            name: boundaries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Items
                name: items
                widget: list
                label_singular: item
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: Closing statement
            name: closing
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Statement, name: statement, widget: text }

          - label: "Closing call to action"
            name: closingCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - label: Primary button
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Secondary button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

      # ---------------------------------------------------------------- #
      - name: contact
        label: Contact page
        file: src/content/data/contact.json
        description: Every section of the Contact page, top to bottom.
        fields:
          - label: Search-engine title & description
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

          - label: Page header
            name: header
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: "Fact strip (4 items)"
                name: meta
                widget: list
                label_singular: fact
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }

          - label: Form introduction
            name: form
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Body, name: body, widget: text }
              - label: "Enquiry-type dropdown options"
                name: topics
                widget: list
                label_singular: option
                field: { label: Option, name: topic, widget: string }

          - label: "Details column labels"
            name: details
            widget: object
            hint: The small captions in the contact-details box next to the form.
            fields:
              - { label: "'Direct' heading", name: directLabel, widget: string }
              - { label: "General email caption", name: generalNote, widget: string }
              - { label: "Partnerships email caption", name: partnershipsNote, widget: string }
              - { label: "Press email caption", name: pressNote, widget: string }
              - { label: "'By phone' heading", name: phoneLabel, widget: string }
              - { label: "Office hours caption", name: officeHoursNote, widget: string }
              - { label: "WhatsApp caption", name: whatsappNote, widget: string }
              - { label: "WhatsApp link text", name: whatsappLabel, widget: string }
              - { label: "'Where we are' heading", name: locationLabel, widget: string }
              - { label: "Location footnote", name: locationNote, widget: text }

          - label: Collaboration types
            name: collaboration
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Lede, name: lede, widget: text }
              - label: Items
                name: items
                widget: list
                label_singular: item
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
              - { label: "What we can't help with", name: declineNote, widget: text }

      # ---------------------------------------------------------------- #
      - name: directions
        label: Future directions
        file: src/content/data/directions.json
        description: >-
          The six category cards shown on both the home page and the About
          page. Edited once here, appears in both places.
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Heading, name: title, widget: string }
          - { label: Lede, name: lede, widget: text }

          - label: Status labels
            name: statusMeta
            widget: object
            collapsed: true
            hint: The four possible status badges a direction can carry.
            fields:
              - label: Exploring
                name: exploring
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: In development
                name: developing
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Selective
                name: selective
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Active interest
                name: active
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }

          - label: Categories
            name: items
            widget: list
            label_singular: category
            summary: "{{fields.title}} ({{fields.status}})"
            fields:
              - {
                  label: ID,
                  name: id,
                  widget: string,
                  pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only"],
                  hint: "Internal identifier. Changing it does not break anything here, but keep it lowercase.",
                }
              - { label: Title, name: title, widget: string }
              - { label: "One-line description", name: description, widget: text }
              - label: Status
                name: status
                widget: select
                options:
                  - { label: Exploring, value: exploring }
                  - { label: In development, value: developing }
                  - { label: Selective, value: selective }
                  - { label: Active interest, value: active }
              - {
                  label: Market focus,
                  name: marketFocus,
                  widget: string,
                  hint: "Written as a route, e.g. Sri Lanka → Europe & the Gulf",
                }
